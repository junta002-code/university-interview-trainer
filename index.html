<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>大学面接質問トレーナー</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f3f6fa;
      color: #1f2937;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      margin: 0 auto;
      background: white;
      padding: 32px 22px;
      display: flex;
      flex-direction: column;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* スタート画面 */

    .title-area {
      text-align: center;
      margin-top: 35px;
      margin-bottom: 40px;
    }

    .title-area h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.4;
      color: #1d4ed8;
    }

    .title-area p {
      margin-top: 12px;
      color: #64748b;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 9px;
    }

    .form-group input {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: 2px solid #dbe3ec;
      border-radius: 10px;
      outline: none;
      background: #fff;
    }

    .form-group input:focus {
      border-color: #3b82f6;
    }

    .button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:active {
      transform: scale(0.98);
    }

    .notice {
      margin-top: 28px;
      padding: 16px;
      border-radius: 10px;
      background: #eff6ff;
      color: #475569;
      font-size: 13px;
      line-height: 1.7;
    }

    /* 質問画面 */

    .question-header {
      text-align: center;
      margin-top: 35px;
      margin-bottom: 30px;
    }

    .question-number {
      display: inline-block;
      padding: 7px 15px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 14px;
      font-weight: 700;
    }

    .question-box {
      margin-top: 30px;
      padding: 25px 20px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }

    .question-text {
      margin: 0;
      font-size: 23px;
      line-height: 1.7;
      font-weight: 700;
      text-align: left;
    }

    .question-info {
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      background: #eff6ff;
      color: #475569;
      font-size: 14px;
      line-height: 1.7;
    }

    .next-button {
      margin-top: 30px;
    }

    .back-button {
      margin-top: 12px;
      background: #64748b;
    }

    /* 終了画面 */

    .finish-area {
      text-align: center;
      margin-top: 80px;
    }

    .finish-area h2 {
      font-size: 28px;
      color: #1d4ed8;
      margin-bottom: 25px;
    }

    .finish-area p {
      font-size: 16px;
      line-height: 1.8;
      color: #475569;
    }

    .footer {
      margin-top: auto;
      padding-top: 35px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 480px) {

      .app {
        padding: 24px 18px;
      }

      .title-area {
        margin-top: 25px;
      }

      .title-area h1 {
        font-size: 27px;
      }

      .question-text {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ==================== -->
    <!-- スタート画面 -->
    <!-- ==================== -->

    <div id="start-screen" class="screen active">

      <div class="title-area">
        <h1>大学面接質問トレーナー</h1>
        <p>大学入試の面接練習を始めましょう</p>
      </div>

      <div class="form-group">
        <label for="university">大学名</label>

        <input
          type="text"
          id="university"
          placeholder="例：岡山大学"
        >
      </div>

      <div class="form-group">
        <label for="faculty">学部・学科</label>

        <input
          type="text"
          id="faculty"
          placeholder="例：文学部"
        >
      </div>

      <button
        class="button"
        onclick="startInterview()"
      >
        面接を始める
      </button>

      <div class="notice">
        大学名と学部・学科を入力してください。
        入力した内容は質問文の一部にも使用します。
      </div>

    </div>


    <!-- ==================== -->
    <!-- 質問画面 -->
    <!-- ==================== -->

    <div id="question-screen" class="screen">

      <div class="question-header">

        <div
          id="question-number"
          class="question-number"
        >
          第1問／10問
        </div>

      </div>

      <div class="question-box">

        <p
          id="question-text"
          class="question-text"
        ></p>

      </div>

      <div class="question-info">
        質問を読んで、声に出して回答してみましょう。
      </div>

      <button
        id="next-button"
        class="button next-button"
        onclick="nextQuestion()"
      >
        次へ
      </button>

      <button
        class="button back-button"
        onclick="backToStart()"
      >
        最初に戻る
      </button>

    </div>


    <!-- ==================== -->
    <!-- 終了画面 -->
    <!-- ==================== -->

    <div id="finish-screen" class="screen">

      <div class="finish-area">

        <h2>
  　　　10問の面接練習が終了しました
</h2>

<p>
  お疲れさまでした。
</p>

<p>
  固定質問5問と、200問の中からランダムに選ばれた
  5問に答えました。
</p>

        <button
          class="button"
          onclick="backToStart()"
        >
          最初に戻る
        </button>

      </div>

    </div>


    <div class="footer">
      大学面接質問トレーナー
    </div>

  </div>


  <script src="questions.js"></script>
  <script>

 /* ==================== */
/* 面接データ */
/* ==================== */

let university = "";
let faculty = "";
let currentQuestion = 0;
let selectedRandomQuestions = [];


/* ==================== */
/* 第1～5問：固定質問 */
/* ==================== */

const fixedQuestions = [

    {
        text: function() {
            return (
                "あなたが" +
                university +
                faculty +
                "を志望した理由を教えてください。"
            );
        }
    },

    {
        text: function() {
            return "高校生活で力を入れて取り組んだことを教えてください。";
        }
    },

    {
        text: function() {
            return (
                university +
                faculty +
                "で、どのようなことを学びたいですか。"
            );
        }
    },

    {
        text: function() {
            return (
                "あなたの長所を教えてください。" +
                "また、その長所を大学生活でどのように生かしたいですか。"
            );
        }
    },

    {
        text: function() {
            return "大学卒業後、どのような進路を考えていますか。";
        }
    }

];


/* ==================== */
/* 第6～10問：ランダム5問 */
/* ==================== */

function selectRandomQuestions() {

    const shuffled = [...randomQuestions];

    for (let i = shuffled.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
            [shuffled[j], shuffled[i]];
    }

    selectedRandomQuestions =
        shuffled.slice(0, 5);
}


/* ==================== */
/* 面接開始 */
/* ==================== */

function startInterview() {

    university =
        document
        .getElementById("university")
        .value
        .trim();

    faculty =
        document
        .getElementById("faculty")
        .value
        .trim();


    if (university === "") {

        alert("大学名を入力してください。");

        return;
    }


    if (faculty === "") {

        alert("学部・学科を入力してください。");

        return;
    }


    currentQuestion = 0;

    selectRandomQuestions();

    showQuestion();
}


/* ==================== */
/* 質問表示 */
/* ==================== */

function showQuestion() {

    document
        .getElementById("start-screen")
        .classList.remove("active");

    document
        .getElementById("finish-screen")
        .classList.remove("active");

    document
        .getElementById("question-screen")
        .classList.add("active");


    let question;


    if (currentQuestion < 5) {

        question =
            fixedQuestions[currentQuestion];

    } else {

        question =
            selectedRandomQuestions[currentQuestion - 5];

    }


    document
        .getElementById("question-number")
        .textContent =
            "第" +
            (currentQuestion + 1) +
            "問／10問";


    document
        .getElementById("question-text")
        .textContent =
            typeof question.text === "function"
                ? question.text()
                : question.text;


    const nextButton =
        document.getElementById("next-button");


    if (currentQuestion === 9) {

        nextButton.textContent = "終了";

    } else {

        nextButton.textContent = "次へ";

    }
}


/* ==================== */
/* 次の質問 */
/* ==================== */

function nextQuestion() {

    if (currentQuestion < 9) {

        currentQuestion++;

        showQuestion();

        return;
    }


    document
        .getElementById("question-screen")
        .classList.remove("active");

    document
        .getElementById("finish-screen")
        .classList.add("active");
}


/* ==================== */
/* 最初に戻る */
/* ==================== */

function backToStart() {

    document
        .getElementById("question-screen")
        .classList.remove("active");

    document
        .getElementById("finish-screen")
        .classList.remove("active");

    document
        .getElementById("start-screen")
        .classList.add("active");
}
    
</script>
</body>
</html>
